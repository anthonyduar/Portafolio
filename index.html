<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-black text-white py-2 px-3 md:px-6 flex flex-col justify-between max-w-[1440px] mx-auto overflow-hidden"
  >
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Contenido Principal -->
    <main class="my-auto py-2">
      <h1
        id="main-title"
        class="text-7xl md:text-7xl font-normal tracking-tight text-center mb-6 transition-opacity duration-150"
      >
        Anthony Duarte
      </h1>

      <section
        class="grid grid-cols-1 md:grid-cols-[1fr_1.4fr_1fr] gap-4 w-full items-stretch"
      >
        <!-- Columna izquierda -->
        <div class="grid grid-cols-1 gap-4">
          <div
            class="relative group bg-[#121212] rounded-3xl p-5 h-[190px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex items-center justify-center overflow-hidden"
          >
            <img
              src="img/foto.png"
              alt="Anthony Duarte"
              class="w-20 h-20 object-cover rounded-full opacity-40 group-hover:opacity-100 group-hover:brightness-125 transition-all duration-300"
            />
          </div>
          <div
            class="relative group bg-[#121212] rounded-3xl p-5 h-[190px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
          >
            <span class="text-xs text-gray-500 relative z-10">Sobre Mí</span>
            <div
              class="absolute inset-0 flex items-center justify-center p-6 text-center z-10"
            >
              <p
                class="text-sm text-white opacity-15 group-hover:opacity-100 transition-opacity duration-300"
              >
                Aquí colocas el texto que deseas mostrar centrado dentro de la
                tarjeta.
              </p>
            </div>
          </div>
        </div>

        <div
          class="bg-[#121212] rounded-3xl p-5 border border-white/5 transition-transform duration-300 hover:scale-[1.02] flex flex-col justify-between block md:min-h-[356px]"
        >
          <div class="flex justify-between items-center">
            <span class="text-xs text-gray-500">Portafolios</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 my-2">
            <!-- 1. Redacción -->
            <a
              href="redaccion.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Redacción"
            >
              <img
                src="img/redaccion.png"
                alt="Portada Redacción"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"
              ></div>
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Redacción
                </h2>
              </div>
            </a>
            <!-- 2. Marketing Digital -->
            <a
              href="marketing.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Marketing Digital"
            >
              <img
                src="img/marketing.png"
                alt="Portada Marketing Digital"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Marketing Digital
                </h2>
              </div>
            </a>
            <!-- 3. Edición de Video -->
            <a
              href="video.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Edición de Video"
            >
              <img
                src="img/edicion.png"
                alt="Portada Edición de Video"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Edición de Video
                </h2>
              </div>
            </a>
            <!-- 4. Diseño -->
            <a
              href="diseno.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Diseño"
            >
              <img
                src="img/diseno.png"
                alt="Portada Diseño"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Diseño
                </h2>
              </div>
            </a>

            <!-- 5. Motion Graphics -->
            <a
              href="motion.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Motion Graphics"
            >
              <img
                src="img/motion.png"
                alt="Portada Motion Graphics"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Motion Graphics
                </h2>
              </div>
            </a>

            <!-- 6. Desarrollo Web -->
            <a
              href="web.html"
              class="portfolio-card relative group bg-[#121212] p-6 rounded-3xl border border-white/5 flex flex-col justify-between h-[130px] hover:border-white/20 hover:scale-[1.02] transition-all duration-300 overflow-hidden"
              data-title="Desarrollo Web"
            >
              <img
                src="img/desarrollo.png"
                alt="Portada Desarrollo Web"
                class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
              />
              <div
                class="relative z-10 flex items-center justify-center h-full"
              >
                <h2 class="text-lg font-medium text-white text-center">
                  Desarrollo Web
                </h2>
              </div>
            </a>
          </div>

          <div></div>
        </div>

        <!-- Columna derecha -->
        <div class="grid grid-cols-1 gap-4">
          <div
            class="bg-[#121212] rounded-3xl p-4 h-[190px] border border-white/5 flex flex-col justify-center items-center relative transition-transform duration-300 hover:scale-[1.01]"
          >
            <div class="flex flex-wrap gap-3 justify-center items-center">
              <!-- 1. Figma -->
              <div
                class="w-10 h-10 flex items-center justify-center"
                title="Figma"
              >
                <img
                  src="img/figma.svg"
                  alt="Figma"
                  class="w-full h-full object-contain"
                />
              </div>

              <!-- 2. CapCut -->
              <div
                class="w-10 h-10 flex items-center justify-center"
                title="CapCut"
              >
                <img
                  src="img/capcut.svg"
                  alt="CapCut"
                  class="w-full h-full object-contain"
                />
              </div>

              <!-- 3. Affinity -->
              <div
                class="w-10 h-10 flex items-center justify-center"
                title="Affinity"
              >
                <img
                  src="img/affinity.svg"
                  alt="Affinity"
                  class="w-full h-full object-contain"
                />
              </div>

              <!-- VS Code -->
              <div
                class="w-10 h-10 flex items-center justify-center"
                title="VS Code"
              >
                <img
                  src="img/vscode.svg"
                  alt="VS Code"
                  class="w-full h-full object-contain"
                />
              </div>
            </div>
          </div>
          <div
            class="bg-[#121212] rounded-3xl p-5 h-[190px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] flex flex-col justify-between relative"
          >
            <span class="text-xs text-gray-500">Contacto</span>

            <!-- Contenedor de los 3 logos -->
            <div class="flex items-center justify-center gap-6 my-auto">
              <!-- 1. Gmail (Copia al portapapeles) -->
              <button
                onclick="copiarCorreo(this)"
                class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-white transition-colors cursor-pointer relative group"
                title="Copiar correo"
              >
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
                  />
                </svg>
                <span
                  class="absolute -top-8 bg-neutral-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap"
                  >Copiar correo</span
                >
              </button>

              <!-- 2. LinkedIn (Enlace clickeable) -->
              <a
                href="https://www.linkedin.com/in/anthonyduar/"
                target="_blank"
                rel="noopener noreferrer"
                class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-[#0A66C2] transition-colors"
                title="LinkedIn"
              >
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"
                  />
                </svg>
              </a>

              <!-- 3. Instagram (Enlace clickeable) -->
              <a
                href="https://instagram.com/anthonyduar"
                target="_blank"
                rel="noopener noreferrer"
                class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-[#E4405F] transition-colors"
                title="Instagram"
              >
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
                  />
                </svg>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script>
      function copiarCorreo(boton) {
        navigator.clipboard.writeText("anthonyraduarte@gmail.com").then(() => {
          let tooltip = boton.querySelector("span");
          tooltip.textContent = "¡Copiado!";
          setTimeout(() => {
            tooltip.textContent = "Copiar correo";
          }, 2000);
        });
      }
    </script>
    <script>
      fetch("navbar.html")
        .then((res) => res.text())
        .then(
          (data) =>
            (document.getElementById("navbar-placeholder").innerHTML = data),
        );
      fetch("footer.html")
        .then((res) => res.text())
        .then(
          (data) =>
            (document.getElementById("footer-placeholder").innerHTML = data),
        );
    </script>
    <script>
      const mainTitle = document.getElementById("main-title");
      const defaultTitle = mainTitle.textContent; // Guarda el texto original ("Anthony Duarte")
      const cards = document.querySelectorAll(".portfolio-card");

      cards.forEach((card) => {
        // Al pasar el mouse, cambia el texto por el valor de data-title
        card.addEventListener("mouseenter", () => {
          const newTitle = card.getAttribute("data-title");
          if (newTitle) mainTitle.textContent = newTitle;
        });

        // Al retirar el mouse, regresa al título original
        card.addEventListener("mouseleave", () => {
          mainTitle.textContent = defaultTitle;
        });
      });
    </script>
  </body>
</html>
