<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio - Redacción</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-black text-white py-2 px-3 md:px-6 flex flex-col justify-between max-w-[1440px] mx-auto overflow-hidden"
  >
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Contenido Principal -->
    <main class="my-auto py-1">
      <h1 class="text-5xl md:text-7xl font-normal tracking-tight text-center mb-6">
        Redacción
      </h1>

      <section class="grid grid-cols-1 md:grid-cols-2 gap-2 w-full max-w-4xl mx-auto items-stretch">
        <!-- Tarjeta 1 -->
        <div
          onclick="abrirModal('modal-seo')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[130px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img 
            src="img/portafolios/articulo2.png" 
            alt="Portada Redacción SEO" 
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">01</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">Redacción SEO</h2>
              <p class="text-sm text-gray-200 line-clamp-1">Artículo de eCommerce.</p>
            </div>
          </div>
        </div>

        <!-- Tarjeta 2 -->
        <div
          onclick="abrirModal('modal-copywriting')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[130px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img 
            src="img/portafolios/noticia1.png" 
            alt="Portada Copywriting" 
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">02</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">Redacción Periodística</h2>
              <p class="text-sm text-gray-200 line-clamp-1">Noticia Deportiva.</p>
            </div>
          </div>
        </div>

        <!-- Tarjeta 3 -->
        <div
          onclick="abrirModal('modal-periodismo')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[130px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img 
            src="img/portafolios/articulo1.png" 
            alt="Portada Periodismo Digital" 
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">03</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">Redacción SEO</h2>
              <p class="text-sm text-gray-200 line-clamp-1">Artículo de eCommerce.</p>
            </div>
          </div>
        </div>

        <!-- Tarjeta 4 -->
        <div
          onclick="abrirModal('modal-gestion')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[130px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img 
            src="img/portafolios/noticia2.png" 
            alt="Portada Redacción Periodística" 
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">04</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">Redacción Periodística</h2>
              <p class="text-sm text-gray-200 line-clamp-1">Noticia Deportiva.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Botón Volver Pro Estilo Dark Minimal -->
    <div class="flex justify-center mt-12">
      <a 
        href="index.html" 
        class="group relative inline-flex items-center gap-3 px-6 py-3 rounded-2xl bg-[#121212] border border-white/10 text-sm font-medium text-gray-300 hover:text-white hover:border-white/20 transition-all duration-300 shadow-2xl cursor-pointer overflow-hidden"
      >
        <div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        <span class="relative z-10 transition-transform duration-300 group-hover:-translate-x-1.5 text-gray-400 group-hover:text-white">←</span>
        <span class="relative z-10 tracking-wide">Volver al inicio</span>
      </a>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder" class="w-full mt-8"></div>

    <!-- Modales -->
    <div id="modal-seo" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
      <div class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl flex flex-col items-center">
        <button onclick="cerrarModal('modal-seo')" class="sticky top-0 self-end text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-10">✕</button>
        <img src="img/portafolios/articulo2.png" alt="Redacción SEO" class="w-full h-auto rounded-lg mt-2"/>
        <a href="https://eparadise.vercel.app/articulo/jbl-go-4" target="_blank" class="mt-6 inline-block bg-white text-black font-medium px-6 py-3 rounded-xl hover:bg-gray-200 transition-colors">Ver en la web →</a>
      </div>
    </div>

    <div id="modal-copywriting" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
      <div class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl flex flex-col items-center">
        <button onclick="cerrarModal('modal-copywriting')" class="sticky top-0 self-end text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-10">✕</button>
        <img src="img/portafolios/noticia1.png" alt="Copywriting" class="w-full h-auto rounded-lg mt-2"/>
        <a href="https://actualnow.vercel.app/shai-record-thunder-celtics" target="_blank" class="mt-6 inline-block bg-white text-black font-medium px-6 py-3 rounded-xl hover:bg-gray-200 transition-colors">Ver en la web →</a>
      </div>
    </div>

    <div id="modal-periodismo" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
      <div class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl flex flex-col items-center">
        <button onclick="cerrarModal('modal-periodismo')" class="sticky top-0 self-end text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-10">✕</button>
        <img src="img/portafolios/articulo1.png" alt="Periodismo Digital" class="w-full h-auto rounded-lg mt-2"/>
        <a href="https://eparadise.vercel.app/articulo/mundo-jur%C3%A1sico-divertido" target="_blank" class="mt-6 inline-block bg-white text-black font-medium px-6 py-3 rounded-xl hover:bg-gray-200 transition-colors">Ver en la web →</a>
      </div>
    </div>

    <div id="modal-gestion" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
      <div class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl flex flex-col items-center">
        <button onclick="cerrarModal('modal-gestion')" class="sticky top-0 self-end text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-10">✕</button>
        <img src="img/portafolios/noticia2.png" alt="Gestión de Contenido" class="w-full h-auto rounded-lg mt-2"/>
        <a href="https://actualnow.vercel.app/venezuela-eeuu-wbc" target="_blank" class="mt-6 inline-block bg-white text-black font-medium px-6 py-3 rounded-xl hover:bg-gray-200 transition-colors">Ver en la web →</a>
      </div>
    </div>

    <script>
      function abrirModal(id) {
        document.getElementById(id).classList.remove('opacity-0', 'pointer-events-none');
      }

      function cerrarModal(id) {
        document.getElementById(id).classList.add('opacity-0', 'pointer-events-none');
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          ['modal-seo', 'modal-copywriting', 'modal-periodismo', 'modal-gestion'].forEach(id => {
            cerrarModal(id);
          });
        }
      });

      fetch("navbar.html")
        .then((res) => res.text())
        .then((data) => (document.getElementById("navbar-placeholder").innerHTML = data));
      
      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => (document.getElementById("footer-placeholder").innerHTML = data));
    </script>
  </body>
</html>
