<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio - Desarrollo Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-black text-white py-2 px-3 md:px-6 flex flex-col justify-between max-w-[1440px] mx-auto overflow-y-auto"
  >
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Contenido Principal -->
    <main class="my-auto py-2">
      <h1
        class="text-5xl md:text-7xl font-normal tracking-tight text-center mb-6"
      >
        Desarrollo Web
      </h1>

      <section
        class="grid grid-cols-1 md:grid-cols-2 gap-2 w-full max-w-4xl mx-auto items-stretch"
      >
        <!-- Tarjeta 1 -->
        <div
          onclick="abrirModal('modal-web-1')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[260px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img
            src="img/portada-web1.png"
            alt="Portada Proyecto Web 1"
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div
            class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"
          ></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">01</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">
                Desarrollo Next.js
              </h2>
              <p class="text-sm text-gray-200 line-clamp-1">
                Portal de noticias deportivas con Next.js y WordPress AP.
              </p>
            </div>
          </div>
        </div>

        <!-- Tarjeta 2 -->
        <div
          onclick="abrirModal('modal-web-2')"
          class="relative group bg-[#121212] rounded-3xl p-6 h-[260px] border border-white/5 transition-transform duration-300 hover:scale-[1.02] cursor-pointer flex flex-col justify-between overflow-hidden"
        >
          <img
            src="img/portada-web2.png"
            alt="Portada Proyecto Web 2"
            class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-90 transition-opacity duration-300"
          />
          <div
            class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/60 to-black/90"
          ></div>
          <div class="relative z-10 flex flex-col justify-between h-full">
            <span class="text-xs text-gray-300">02</span>
            <div>
              <h2 class="text-xl font-medium mb-1 text-white">
                Automatización Web
              </h2>
              <p class="text-sm text-gray-200 line-clamp-1">
                Plataforma e-commerce con sincronización automática.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Botón Volver Pro Estilo Dark Minimal -->
      <div class="flex justify-center mt-12">
        <a 
          href="index.html" 
          class="group relative inline-flex items-center gap-3 px-6 py-3 rounded-2xl bg-[#121212] border border-white/10 text-sm font-medium text-gray-300 hover:text-white hover:border-white/20 transition-all duration-300 shadow-2xl cursor-pointer overflow-hidden"
        >
          <!-- Efecto de brillo interno al pasar el mouse -->
          <div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          
          <span class="relative z-10 transition-transform duration-300 group-hover:-translate-x-1.5 text-gray-400 group-hover:text-white">←</span>
          <span class="relative z-10 tracking-wide">Volver al inicio</span>
        </a>
      </div>

    <!-- Footer -->
    <div id="footer-placeholder" class="w-full mt-8"></div>

    <!-- Modales -->
    <!-- Modal 1 -->
    <div
      id="modal-web-1"
      class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4"
    >
      <div
        class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl"
      >
        <button
          onclick="cerrarModal('modal-web-1')"
          class="sticky top-0 float-right text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-20"
        >
          ✕
        </button>

        <!-- Contenedor con la imagen y el botón flotante "Ver sitio en vivo" -->
        <div class="relative mt-4 inline-block w-full">
          <img
            src="img/portafolios/web1.png"
            alt="Detalle del proyecto web 1"
            class="w-full h-auto rounded-lg block"
          />
          <a
            href="https://actualnow.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            style="position: absolute; top: 170px; left: 45px;"
            class="z-10 bg-black/80 hover:bg-black text-blue-400 hover:text-blue-300 text-sm font-medium px-3.5 py-1.5 rounded-lg backdrop-blur-md transition-all duration-200 flex items-center gap-1.5 border border-white/10 shadow-lg"
          >
            Ver sitio en vivo 🌐
          </a>
        </div>

        <!-- Botón de GitHub -->
        <div class="mt-6 flex justify-center">
          <a
            href="https://github.com/anthonyduar/ActualNow"
            target="_blank"
            rel="noopener noreferrer"
            class="bg-[#24292e] hover:bg-[#2f363d] text-white font-medium px-6 py-3 rounded-xl transition-colors duration-200 flex items-center gap-2 border border-white/10"
          >
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            Ver repositorio
          </a>
        </div>
      </div>
    </div>

    <!-- Modal 2 -->
    <div
      id="modal-web-2"
      class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4"
    >
      <div
        class="relative bg-neutral-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 border border-neutral-800 shadow-2xl"
      >
        <button
          onclick="cerrarModal('modal-web-2')"
          class="sticky top-0 float-right text-white text-lg bg-neutral-800 px-3 py-1 rounded-full hover:bg-neutral-700 cursor-pointer z-20"
        >
          ✕
        </button>

        <!-- Contenedor con la imagen y el botón flotante "Ver sitio en vivo" -->
        <div class="relative mt-4 inline-block w-full">
          <img
            src="img/portafolios/web2.png"
            alt="Detalle del proyecto web 2"
            class="w-full h-auto rounded-lg block"
          />
          <a
            href="https://eparadise.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            style="position: absolute; top: 165px; left: 55px;"
            class="z-10 bg-black/80 hover:bg-black text-blue-400 hover:text-blue-300 text-sm font-medium px-3.5 py-1.5 rounded-lg backdrop-blur-md transition-all duration-200 flex items-center gap-1.5 border border-white/10 shadow-lg"
          >
            Ver sitio en vivo 🌐
          </a>
        </div>

        <!-- Botón de GitHub -->
        <div class="mt-6 flex justify-center">
          <a
            href="https://github.com/anthonyduar/eParadise"
            target="_blank"
            rel="noopener noreferrer"
            class="bg-[#24292e] hover:bg-[#2f363d] text-white font-medium px-6 py-3 rounded-xl transition-colors duration-200 flex items-center gap-2 border border-white/10"
          >
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            Ver repositorio
          </a>
        </div>
      </div>
    </div>

    <script>
      function abrirModal(id) {
        document
          .getElementById(id)
          .classList.remove("opacity-0", "pointer-events-none");
      }

      function cerrarModal(id) {
        document
          .getElementById(id)
          .classList.add("opacity-0", "pointer-events-none");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          ["modal-web-1", "modal-web-2"].forEach((id) => {
            cerrarModal(id);
          });
        }
      });

      fetch("navbar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>
  </body>
</html>
